name: build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: checkout code
        uses: actions/checkout@v6.0.2

      - name: build
        run: docker build -t ${{VERSION}} ./backend

      - name: image tags
        run: docker tag ${{VERSION}}.${{github.run_number}} halfblood9/web_app:${{VERSION}}.${{github.run_number}}

      - name: docker login
        uses: docker/login-action@v3.5.0
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: push
        run: docker push halfblood9/web_app:${{VERSION}}.${{github.run_number}}

      - name: image pull
        run: docker pull halfblood9/web_app:${{VERSION}}.${{github.run_number}}

      - name: docker container
        run: docker run -d -p 8000:8000 --name web_app_v1.2 halfblood9/web_app:${{VERSION}}.${{github.run_number}}

        
