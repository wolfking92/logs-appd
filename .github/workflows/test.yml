name: build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      VERSION: "V2"

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      # --- PART 1: Build and Push to Docker Hub (Your Backup) ---
      - name: build
        run: docker build -t halfblood9/web_app:${{env.VERSION}}.${{github.run_number}} ./backend

      - name: docker login
        uses: docker/login-action@v3.5.0
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: push
        run: docker push halfblood9/web_app:${{env.VERSION}}.${{github.run_number}}

      # --- PART 2: Deploy to Hugging Face ---
      - name: Deploy to Hugging Face
        env:
          HF_TOKEN: ${{secrets.HF_TOKEN}} # Make sure you add this secret to GitHub Settings
          HF_SPACE_URL: ${{secrets.HF_SPACE_URL}} # Make sure you add your HF Git URL here
        run: |
          # 1. Configure Git User
          git config user.email "action@github.com"
          git config user.name "GitHub Action"

          # 2. Add Hugging Face as a Remote
          # We replace the 'https://' with 'https://USERNAME:TOKEN@' to allow automated push
          HF_URL_AUTH=$(echo $HF_SPACE_URL | sed "s|https://|https://oauth2:$HF_TOKEN@|")
          git remote add hf $HF_URL_AUTH || git remote set-url hf $HF_URL_AUTH
          
          # 3. Push ONLY the 'backend' folder to the ROOT of Hugging Face
          # This command takes the contents of 'backend/' and makes them appear at root '/'
          # on the Hugging Face server.
          git subtree push --prefix backend hf main
