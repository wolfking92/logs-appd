name: build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      VERSION: "V2"

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      # --- PART 1: Build and Push to Docker Hub (Your Backup) ---
      - name: build
        run: docker build -t halfblood9/web_app:${{env.VERSION}}.${{github.run_number}} ./backend

      - name: docker login
        uses: docker/login-action@v3.5.0
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: push
        run: docker push halfblood9/web_app:${{env.VERSION}}.${{github.run_number}}

           # --- PART 2: Deploy to Hugging Face ---
      - name: Deploy to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_URL: ${{ secrets.HF_SPACE_URL }}
        run: |
          # DEBUGGING: Check if secrets are loaded
          if [[ -z "$HF_TOKEN" ]]; then
            echo "ERROR: HF_TOKEN secret is not set in GitHub Settings."
            exit 1
          fi
          if [[ -z "$HF_SPACE_URL" ]]; then
            echo "ERROR: HF_SPACE_URL secret is not set in GitHub Settings."
            exit 1
          fi
          echo "Secrets loaded successfully."

          # 1. Configure Git User
          git config user.email "action@github.com"
          git config user.name "GitHub Action"

          # 2. Construct the Auth URL
          HF_URL_AUTH=$(echo "$HF_SPACE_URL" | sed "s|https://|https://oauth2:$HF_TOKEN@|")
          
          # 3. Add Remote
          git remote remove hf 2> /dev/null || true
          git remote add hf "$HF_URL_AUTH"
          
          # 4. PUSH WITH FORCE
          # We split the backend folder into a temporary commit ID and push it forcefully
          echo "Starting force push..."
          git push hf $(git subtree split --prefix backend main):main --force
          
